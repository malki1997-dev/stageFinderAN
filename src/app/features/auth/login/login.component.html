<div class="login-container">
  <div class="login-card">
    <div class="header">
      <img src="assets/images/LOGO.png" alt="Stage Finder Logo" class="logo">
      <div class="tabs">
        <span class="tab inactive" (click)="regchoix()">Inscription</span>
        <span class="tab active">Connexion</span>
      </div>
    </div>
    <form class="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email" class="input-field">
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Mot de passe" class="input-field">
      </div>
      <div class="options">
        <label class="checkbox-container">
          <input type="checkbox"> Se souvenir de moi
        </label>
        <a href="#" class="forgot-password">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="submit-button">SE CONNECTER</button>
    </form>
  </div>
</div>
