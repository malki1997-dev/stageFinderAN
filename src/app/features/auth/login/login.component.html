<div class="login-container">
  <div class="login-card">
    <div class="header">
      <img src="assets/images/LOGO.png" alt="Stage Finder Logo" class="logo">
      <div class="tabs">
        <span class="tab inactive" (click)="regchoix()">Inscription</span>
        <span class="tab active">Connexion</span>
      </div>
    </div>

    <!-- Added form submission and form binding -->
    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Error message display -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Email"
          class="input-field"
          [ngClass]="{'invalid-field': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="validation-error">
          <div *ngIf="loginForm.get('email')?.errors?.['required']">Email est requis</div>
          <div *ngIf="loginForm.get('email')?.errors?.['email']">Email invalide</div>
        </div>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Mot de passe"
          class="input-field"
          [ngClass]="{'invalid-field': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="validation-error">
          <div *ngIf="loginForm.get('password')?.errors?.['required']">Mot de passe est requis</div>
          <div *ngIf="loginForm.get('password')?.errors?.['minlength']">
            Le mot de passe doit contenir au moins 6 caractères
          </div>
        </div>
      </div>

      <div class="options">
        <label class="checkbox-container">
          <input type="checkbox"> Se souvenir de moi
        </label>
        <a href="#" class="forgot-password">Mot de passe oublié ?</a>
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="loginForm.invalid">
        SE CONNECTER
      </button>
    </form>
  </div>
</div>
