<ul class="list-group" style="max-height: 300px; overflow-y: auto;">
  <li *ngFor="let notif of notifications"
      class="list-group-item d-flex justify-content-between align-items-center"
      [ngClass]="{'bg-white': notif.read, 'bg-info text-white': !notif.read}">

    <div>
      <strong>{{ notif.message }}</strong> -
      <small>{{ notif.dateEnvoie | date:'short' }}</small>
    </div>

    <i class="material-icons" style="font-size:24px;"
       [ngStyle]="{'color': notif.read ? 'green' : 'white'}">
      {{ notif.read ? 'visibility' : 'visibility_off' }}
    </i>

  </li>
</ul>
